name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Run regression checks
        run: |
          node scripts/strategy-check.mjs
          node scripts/indicator-check.mjs
          node scripts/freshness-check.mjs
          node scripts/signal-schema-check.mjs
          node scripts/live-update-check.mjs
          node scripts/candle-chart-check.mjs
          node --no-warnings scripts/render-security-check.mjs
          node scripts/workflow-security-check.mjs
          node --no-warnings scripts/live-price-check.mjs
          node --no-warnings scripts/notification-check.mjs
          node scripts/check.mjs
          git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check

  deploy:
    needs: validate
    if: ${{ github.event_name != 'pull_request' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
