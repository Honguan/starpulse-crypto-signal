name: Update Live Signals

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data-publisher
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - id: api
        run: |
          if [ -n "$COINGECKO_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "COINGECKO_API_KEY is not configured; skipped live update."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - name: Prepare live data branch
        if: steps.api.outputs.ready == 'true'
        run: |
          LIVE_DIR="$GITHUB_WORKSPACE/live-data"
          if git ls-remote --exit-code --heads origin live-data; then
            git fetch origin live-data
            git worktree add --detach "$LIVE_DIR" origin/live-data
          else
            git worktree add -b live-data "$LIVE_DIR"
          fi
      - name: Generate live signals
        if: steps.api.outputs.ready == 'true'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          LIVE_DATA_DIR: ${{ github.workspace }}/live-data/data
        run: node scripts/update-live-signals.mjs
      - name: Commit and publish live signals
        if: steps.api.outputs.ready == 'true'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          LIVE_DATA_DIR: ${{ github.workspace }}/live-data/data
        run: |
          cd "$GITHUB_WORKSPACE/live-data"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2; do
            git add data/signals.json data/price-history.json
            if git diff --cached --quiet; then
              echo "signals unchanged"
              exit 0
            fi
            git commit -m "chore: update live signals"
            if git push origin HEAD:live-data; then
              exit 0
            fi
            if [ "$attempt" = 2 ]; then
              echo "::error::live-data changed again; publication aborted without force-pushing"
              exit 1
            fi
            echo "::warning::live-data push conflict; regenerating once from the latest remote state"
            git fetch origin live-data
            git reset --hard origin/live-data
            cd "$GITHUB_WORKSPACE"
            node scripts/update-live-signals.mjs
            cd "$GITHUB_WORKSPACE/live-data"
          done
