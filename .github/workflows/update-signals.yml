name: Update Live Signals

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

concurrency:
  group: live-data-publisher
  cancel-in-progress: false

jobs:
  update:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - id: api
        run: |
          if [ -n "$COINGECKO_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "COINGECKO_API_KEY is not configured; skipped live update."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      - name: Restore bounded internal state
        if: steps.api.outputs.ready == 'true'
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: .live-state
          key: live-state-v2-${{ github.run_id }}
          restore-keys: live-state-v2-
      - name: Prepare live snapshot branch
        if: steps.api.outputs.ready == 'true'
        run: |
          LIVE_DIR="$GITHUB_WORKSPACE/live-data"
          git fetch --no-tags origin live-data
          git worktree add --detach "$LIVE_DIR" origin/live-data
          echo "LIVE_DATA_EXPECTED_SHA=$(git rev-parse origin/live-data)" >> "$GITHUB_ENV"
      - name: Generate live signals
        if: steps.api.outputs.ready == 'true'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          LIVE_DATA_DIR: ${{ github.workspace }}/live-output
          LIVE_STATE_FILE: ${{ github.workspace }}/.live-state/price-history.json
        run: node scripts/update-live-signals.mjs
      - name: Publish single-commit live snapshot
        if: steps.api.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/live-data"
          git switch --orphan snapshot
          test -z "$(git ls-files)" || { echo "::error::orphan index is not empty"; exit 1; }
          mkdir -p data
          cp "$GITHUB_WORKSPACE/live-output/signals.json" data/signals.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUTH_HEADER=$(printf "x-access-token:%s" "$GH_TOKEN" | base64 -w0)
          git add data/signals.json
          git commit -m "chore: publish live snapshot"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push \
            --force-with-lease="refs/heads/live-data:$LIVE_DATA_EXPECTED_SHA" origin HEAD:live-data
